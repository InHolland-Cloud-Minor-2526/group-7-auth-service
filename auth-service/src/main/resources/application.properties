# JWT
mp.jwt.verify.issuer=expense-auth-service
mp.jwt.verify.publickey.location=classpath:keys/publicKey.pem
smallrye.jwt.sign.key.location=classpath:keys/privateKey.pem

# Hibernate / JPA
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.bind-parameters=true

# Datasource (local)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=user
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/db

# HTTP
quarkus.http.port=8080

# ===== Password reset delivery (NO FRONTEND) =====
# Empty means: EmailService should send token + API instructions instead of a link
app.reset.frontend-url=

# DEV defaults: no SMTP, log token so you can test
app.mail.enabled=false
app.reset.dev-log-token=true

# Optional: PROD profile (OpenShift) settings
%prod.app.mail.enabled=true
%prod.app.reset.dev-log-token=false
