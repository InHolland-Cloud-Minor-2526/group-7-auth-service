# ===============================
# PostgreSQL Deployment
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-db
  template:
    metadata:
      labels:
        app: auth-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: auth_db
            - name: POSTGRES_USER
              value: user
            - name: POSTGRES_PASSWORD
              value: password

---
# ===============================
# PostgreSQL Service
# ===============================
apiVersion: v1
kind: Service
metadata:
  name: auth-db
spec:
  selector:
    app: auth-db
  ports:
    - port: 5432
      targetPort: 5432

---
# ===============================
# Auth Service Deployment
# ===============================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/inholland-cloud-minor-2526/group-7-auth-service/auth-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://auth-db:5432/auth_db
            - name: QUARKUS_DATASOURCE_USERNAME
              value: user
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: password

---
# ===============================
# Auth Service (Internal)
# ===============================
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8080
      targetPort: 8080

---
# ===============================
# Auth Service Route (External)
# ===============================
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: auth-service
spec:
  to:
    kind: Service
    name: auth-service
  port:
    targetPort: 8080
