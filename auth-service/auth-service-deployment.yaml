apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/MTKabir/group-7-auth-service/auth-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: jdbc:postgresql://auth-db:5432/auth_db
              
            - name: QUARKUS_DATASOURCE_USERNAME
              value: user

            - name: QUARKUS_DATASOURCE_PASSWORD
              value: password
