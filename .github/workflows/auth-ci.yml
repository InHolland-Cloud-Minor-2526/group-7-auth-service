name: Build & Push Quarkus Services to GHCR

on:
  push:
    branches:
      - user-registration

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build auth-service
        working-directory: auth-service
        run: ./mvnw clean package -DskipTests

      - name: Build & Push auth-service image
        working-directory: auth-service
        run: |
          docker build -t ghcr.io/inholland-cloud-minor-2526/group-7-auth-service/auth-service:latest .
          docker push ghcr.io/inholland-cloud-minor-2526/group-7-auth-service/auth-service:latest
      - name: Install OpenShift CLI (oc)
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/
          oc version

      - name: Login to OpenShift
        run: |
          oc login ${{ secrets.OPENSHIFT_SERVER }} \
            --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --insecure-skip-tls-verify=true

      - name: Deploy to OpenShift
        run: |
          oc project ${{ secrets.OPENSHIFT_NAMESPACE }}
          oc apply -f k8s/
      - name: Force rollout
        run: oc rollout restart deployment auth-service
